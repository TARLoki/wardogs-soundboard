name: Wiki synchronisieren

# Die Wiki-Seiten werden in docs/wiki gepflegt und bei jeder Änderung
# automatisch ins GitHub-Wiki kopiert. Änderungen direkt im Wiki werden
# dabei überschrieben – bitte immer docs/wiki bearbeiten.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", ".github/workflows/wiki-sync.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wiki aktualisieren
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki
          rsync -a --delete --exclude ".git" docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki ist bereits aktuell."
            exit 0
          fi
          git commit -m "Wiki aus docs/wiki aktualisiert (${GITHUB_SHA::7})"
          git push
